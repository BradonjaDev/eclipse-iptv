name: Screenshots

# Faehrt die App mit Testdaten durch (Robolectric, ohne Geraet) und legt die
# Bildschirmfotos als Artefakt "screenshots" ab. Laeuft ausserdem alle Unit-Tests.

on:
  push:
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

concurrency:
  group: shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Tests und Screenshots
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            app/build/shots/
            app/build/reports/tests/
          if-no-files-found: warn
