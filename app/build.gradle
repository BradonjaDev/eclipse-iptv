plugins {
    id 'com.android.application'
}

android {
    namespace 'de.eclipseiptv'
    compileSdk 35

    defaultConfig {
        applicationId 'de.eclipseiptv'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '0.9.0'
    }

    // Fester Schluessel, damit sich spaetere Versionen ueber die alte installieren lassen.
    // Er kommt aus den Umgebungsvariablen ECLIPSE_KEYSTORE_FILE und ECLIPSE_KEYSTORE_PASSWORD
    // (in GitHub Actions aus den Secrets). Fehlen sie, etwa in einem Fork, wird mit dem
    // Debug-Schluessel signiert.
    def keystoreFile = System.getenv('ECLIPSE_KEYSTORE_FILE')
    def keystorePassword = System.getenv('ECLIPSE_KEYSTORE_PASSWORD')
    def hasKey = keystoreFile && keystorePassword && file(keystoreFile).exists()

    signingConfigs {
        if (hasKey) {
            eclipse {
                storeFile file(keystoreFile)
                storePassword keystorePassword
                keyAlias 'eclipse'
                keyPassword keystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasKey ? signingConfigs.eclipse : signingConfigs.debug
        }
        debug {
            if (hasKey) signingConfig signingConfigs.eclipse
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                maxHeapSize = '2g'
                systemProperty 'shots.dir', "${project.layout.buildDirectory.get().asFile}/shots"
                testLogging { events 'failed'; exceptionFormat 'full' }
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    def media3 = '1.9.0'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    // Software-Dekoder fuer Tonformate, die viele TV-Boxen nicht selbst koennen (AC3, E-AC3, DTS, TrueHD)
    implementation "org.jellyfin.media3:media3-ffmpeg-decoder:$media3+1"
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'androidx.test:core:1.6.1'
}
